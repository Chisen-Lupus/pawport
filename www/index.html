<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PawPort Local Preview</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #6c63ff, #3fb6d6);
        color: white;
      }
      .card {
        max-width: 720px;
        padding: 32px;
        border-radius: 24px;
        background: rgba(255,255,255,0.14);
        backdrop-filter: blur(20px);
        box-shadow: 0 16px 40px rgba(0,0,0,0.2);
      }
      code { background: rgba(0,0,0,0.18); padding: 2px 6px; border-radius: 8px; }
      a { color: #fff; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>🐾 PawPort 本地预览站</h1>
      <p>这里是用于本地部署与迁移调试的占位站点，后续会替换成正式的前端应用。</p>
      <p>当前本地开发地址：<code>http://localhost:5173</code></p>
      <p>后端 API：<code>http://localhost:3001/api/health</code></p>
      <p>部署目标：<code>pawport.me</code> / <code>45.32.59.92</code></p>
      <p>扩展入口已预留，后续可接入活跃用户、兽聚统计、酒店协作等功能。</p>
    </main>
  </body>
</html>
